name: Python prototype checks

on:
  push:
    paths:
      - "python/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q python/mcpepy python/tests
      - name: Run unit tests
        env:
          PYTHONPATH: python
        run: python -m unittest discover -s python/tests -v
